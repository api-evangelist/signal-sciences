aid: signal-sciences
name: Signal Sciences
description: >-
  Signal Sciences is a web application and API protection (WAAP) company whose
  Next-Gen Web Application Firewall (WAF) and Runtime Application Self-Protection
  (RASP) defend web apps, APIs, and microservices against the OWASP Top 10,
  account takeover, and malicious bots without the tuning burden of legacy WAFs.
  Founded in 2014 by Andrew Peterson, Nick Galbreath, and Zane Lackey and backed
  by CRV, Index Ventures, and others, Signal Sciences was acquired by Fastly in
  October 2020 for approximately $775M and is now sold as the Fastly Next-Gen
  WAF. The product retains its own control plane and REST API at
  dashboard.signalsciences.net/api/v0, which remains live for existing customers
  and lets developers programmatically manage corps, sites, requests, events,
  custom signals, rules, redactions, lists, rate-limited sources, thresholds,
  virtual patches, and workspace alerts. Product documentation now lives on the
  Fastly developer documentation site.
