apis:
- aid: signal-sciences:core-api
  name: Signal Sciences Core API
  description: >-
    The Signal Sciences Core API (now the Fastly Next-Gen WAF control-plane API)
    is a REST API served at https://dashboard.signalsciences.net/api/v0 that lets
    developers manage the Next-Gen WAF programmatically. Resources are organized
    under a corp then site hierarchy and include Agent Keys, Agents, Custom
    Dashboards, Custom Signals, Events, Header Links, Lists, Rate Limited Sources,
    Redactions, Reports, Requests, Rules, Simulate, Thresholds, Time Series,
    Virtual Patches, Workspace Alerts, and Workspaces. Authentication is
    token-based (a session token obtained from POST /auth, or a personal API
    access token). Responses are JSON; errors use a {"message": ...} envelope.
  baseURL: https://dashboard.signalsciences.net
